[package]
name = "donkeywork-desktop-cli"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "dwdesktop"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
jsonschema = { version = "0.33", default-features = false }
nix = { version = "0.29", features = ["socket", "user", "fs"] }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

