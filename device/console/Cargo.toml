[package]
name = "dwdesktop-console"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
libdrmtap = "=0.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "dwconsole-daemon"
path = "src/bin/daemon.rs"

[[bin]]
name = "dwconsole"
path = "src/bin/cli.rs"
