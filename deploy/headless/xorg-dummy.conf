# Dedicated virtual X11 display; never loads a physical GPU/input driver.
Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
    Option "AutoAddGPU" "false"
    Option "DontVTSwitch" "true"
    Option "AllowMouseOpenFail" "true"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection

Section "ServerLayout"
    Identifier "DonkeyWorkHeadless"
    Screen 0 "DonkeyWorkScreen" 0 0
EndSection

Section "Device"
    Identifier "DonkeyWorkDummy"
    Driver "dummy"
    VideoRam 131072
    DacSpeed 600
EndSection

Section "Monitor"
    Identifier "DonkeyWorkMonitor"
    HorizSync 28.0-160.0
    VertRefresh 50.0-75.0
    DisplaySize 1016 571
    Modeline "3840x2160" 594.00 3840 4016 4104 4400 2160 2168 2178 2250 +HSync +VSync
    Modeline "1920x1080" 148.50 1920 2008 2052 2200 1080 1084 1089 1125 +HSync +VSync
    Option "PreferredMode" "3840x2160"
EndSection

Section "Screen"
    Identifier "DonkeyWorkScreen"
    Device "DonkeyWorkDummy"
    Monitor "DonkeyWorkMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "3840x2160" "1920x1080"
        Virtual 3840 2160
    EndSubSection
EndSection
